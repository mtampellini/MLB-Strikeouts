[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlb-strikeouts"
version = "0.1.0"
description = "MLB pitcher strikeout prop betting model: E[BF] x P(K|PA), Negative Binomial pricing, EV vs FD/DK alt K lines."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Michael Tampellini" }]

dependencies = [
    "pybaseball>=2.2.7",
    "requests>=2.31",
    "beautifulsoup4>=4.12",  # FanGraphs RosterResource scrape
    "lxml>=5.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.12",           # NB CDF, MLE for dispersion fit
    "pyarrow>=15",           # pandas to_parquet backend
    "scikit-learn>=1.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
